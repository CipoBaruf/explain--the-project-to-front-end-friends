# Deploys the staging branch to the Cloud Run staging service.
#
# Trigger notes:
# - `push` fires when a human pushes to staging.
# - `workflow_dispatch` exists because pushes made with the default GITHUB_TOKEN
#   (e.g. from agent.yml) do NOT fire push workflows — agent.yml dispatches this
#   workflow explicitly after updating the staging branch.
name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Test gate (independent of the agent's own checks)
        working-directory: app
        run: npm run check

      - name: Check GCP config
        id: gcp_check
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::warning::GCP_SA_KEY not set (run scripts/bootstrap.sh) — skipping deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/auth@v2
        if: steps.gcp_check.outputs.configured == 'true'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.gcp_check.outputs.configured == 'true'

      - name: Deploy to Cloud Run
        id: deploy
        if: steps.gcp_check.outputs.configured == 'true'
        run: |
          gcloud run deploy auto-flow-staging \
            --source app \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --allow-unauthenticated \
            --min-instances 0 \
            --set-env-vars APP_ENV=staging \
            --quiet
          URL=$(gcloud run services describe auto-flow-staging \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}

      - name: Notify success
        if: steps.gcp_check.outputs.configured == 'true'
        run: |
          ./scripts/notify.sh "🟡 Staging deployed: ${DEPLOY_URL}
          Test it, then reply /changes <feedback> or /release."
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}

      - name: Notify failure
        if: failure()
        run: |
          ./scripts/notify.sh "🔴 Staging deploy FAILED for ${GITHUB_REPOSITORY}. See ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
